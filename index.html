<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Admission Test Portal</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent: #00f2fe;
      --accent-purple: #4facfe;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --correct: #2ea043;
      --wrong: #da3633;
      --border: #232d42;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .portal-container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* CSS Embedded Avatar SVG Logo */
    .avatar-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
      background: #101522;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .header h2 {
      color: var(--accent);
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .timer-badge {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .question-box { margin-bottom: 25px; }

    .question-title {
      font-size: 1.15rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #1c2538;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.98rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: var(--accent);
      background: #232e47;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.15);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 10px 24px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent));
      color: #0b0f19;
    }

    .btn:hover { opacity: 0.9; }

    .result-screen {
      text-align: center;
      padding: 20px 0;
    }

    .score-display {
      font-size: 3rem;
      color: var(--accent);
      margin: 15px 0;
      font-weight: bold;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      background: #1c2538;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="portal-container" id="portal">
  <div class="header">
    <div class="header-left">
      <!-- Direct Embedded Vector Logo (No Image Hosting Needed) -->
      <div class="avatar-logo">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#151c2c"/>
          <path d="M25 85C25 70 35 60 50 60C65 60 75 70 75 85" stroke="#da3633" stroke-width="8" stroke-linecap="round"/>
          <circle cx="50" cy="42" r="18" fill="#fcd5ce"/>
          <path d="M30 38C30 25 40 18 50 18C60 18 70 25 70 38C70 42 66 45 66 45C66 45 60 35 50 35C40 35 34 45 34 45C34 45 30 42 30 38Z" fill="#1b1b1b"/>
          <rect x="22" y="32" width="10" height="20" rx="4" fill="#111" stroke="#00f2fe" stroke-width="2"/>
          <rect x="68" y="32" width="10" height="20" rx="4" fill="#111" stroke="#00f2fe" stroke-width="2"/>
          <path d="M32 35C40 20 60 20 68 35" stroke="#111" stroke-width="4" fill="none"/>
        </svg>
      </div>
      <h2 id="portal-title">Engineering Admission Test</h2>
    </div>
    <div class="timer-badge" id="timer">20:00</div>
  </div>

  <div id="quiz-body">
    <div class="question-box">
      <div class="question-title" id="question-text">Loading question...</div>
      <div class="options-grid" id="options-container"></div>
    </div>

    <div class="footer">
      <span id="progress" style="color: var(--text-muted); align-self: center;">Question 1 of 20</span>
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>

  <div id="result-body" class="result-screen" style="display: none;">
    <h2>Test Completed!</h2>
    <div class="score-display" id="final-score">0.00 / 20</div>
    <div class="stats">
      <div>Correct: <b id="correct-cnt" style="color: var(--correct);">0</b></div>
      <div>Wrong: <b id="wrong-cnt" style="color: var(--wrong);">0</b></div>
      <div>Skipped: <b id="skip-cnt" style="color: var(--text-muted);">0</b></div>
    </div>
    <p id="feedback-text" style="color: var(--text-muted); margin-bottom: 25px;"></p>
    <button class="btn btn-primary" onclick="restartExam()">Retake Test</button>
  </div>
</div>

<script>
  const questions = [
    { question: "১. একটি বস্তুকে v বেগ দিয়ে খাড়া ওপরের দিকে নিক্ষেপ করা হলে সেটি সর্বোচ্চ কত উচ্চতায় উঠবে?", options: ["v / g<sup>2</sup>", "v² / g", "v² / 2g", "2v / g"], answer: 2 },
    { question: "২. ১ HP (হর্স পাওয়ার) সমান কত ওয়াট?", options: ["746 W", "750 W", "1000 W", "500 W"], answer: 0 },
    { question: "৩. ভেক্টর A = 2i + 3j এবং B = 3i - 2j এর মধ্যবর্তী কোণ কত?", options: ["0°", "45°", "90°", "180°"], answer: 2 },
    { question: "৪. লিফট g ত্বরণে নিচে নামলে ভেতরে থাকা কোনো ব্যক্তির অনুভূত ওজন কত হবে?", options: ["2mg", "mg", "mg / 2", "0"], answer: 3 },
    { question: "৫. পৃথিবীর কেন্দ্রে কোনো বস্তুর ওজন কত?", options: ["অসীম", "শূন্য", "9.8 N", "9.8 kg"], answer: 1 },
    { question: "৬. কাজের মাত্রা সমীকরণ কোনটি?", options: ["MLT⁻¹", "ML²T⁻²", "ML²T⁻³", "ML⁻¹T⁻²"], answer: 1 },
    { question: "৭. কৌণিক ভরবেগের একক কোনটি?", options: ["kg m s⁻¹", "kg m² s⁻¹", "kg m s⁻²", "N m"], answer: 1 },
    { question: "৮. সরল দোলকের গতিপথ কেমন?", options: ["রৈখিক", "বৃত্তাকার", "সরল রৈখিক পর্যায়বৃত্ত গতি", "উপবৃত্তাকার"], answer: 2 },
    { question: "৯. কোনো স্প্রিংকে কেটে দুভাগ করলে প্রতিটি ভাগের স্প্রিং ধ্রুবক কেমন হবে?", options: ["অর্ধেক হবে", "দ্বিগুণ হবে", "একই থাকবে", "চারগুণ হবে"], answer: 1 },
    { question: "১০. ইয়ং-এর গুণাঙ্কের একক কোনটি?", options: ["N/m", "N/m² (Pa)", "N m", "একক নেই"], answer: 1 },
    { question: "১১. d/dx (sin²x + cos²x) = কত?", options: ["1", "0", "2sinx", "2cosx"], answer: 1 },
    { question: "১২. ∫ (1/x) dx = কত?", options: ["ln|x| + c", "-1/x² + c", "eˣ + c", "x + c"], answer: 0 },
    { question: "১৩. (1, 2) এবং (4, 6) বিন্দুদ্বয়ের সংযোগকারী রেখার ঢাল কত?", options: ["3/4", "4/3", "1/2", "2"], answer: 1 },
    { question: "১৪. ম্যাট্রিক্স A এর অসংঘায়িত বিপরীত ম্যাট্রিক্স (A⁻¹) থাকার শর্ত কোনটি?", options: ["det(A) = 0", "det(A) ≠ 0", "A একটি বর্গ ম্যাট্রিক্স নয়", "A = 0"], answer: 0 },
    { question: "১৫. i² = -1 হলে, i⁴ + i⁸ + i¹² = কত?", options: ["-1", "0", "3", "1"], answer: 2 },
    { question: "১৬. পর্যায়বৃত্ত গতির ক্ষেত্রে পর্যায়কাল T এবং কম্পাঙ্ক f এর সম্পর্ক কী?", options: ["T = f", "T = 1/f", "T = f²", "T = 2πf"], answer: 1 },
    { question: "১৭. অসংরক্ষণশীল বলের উদাহরণ কোনটি?", options: ["মহাকর্ষ বল", "তড়িৎ বল", "ঘর্ষণ বল", "স্প্রিং বল"], answer: 2 },
    { question: "১৮. একটি কণার বেগ দ্বিগুণ করা হলে তার গতিশক্তি কত গুণ বৃদ্ধি পাবে?", options: ["২ গুণ", "৩ গুণ (মোট ৪ গুণ)", "৪ গুণ", "৮ গুণ"], answer: 1 },
    { question: "১৯. বহুপদী সমীকরণ x² - 5x + 6 = 0 এর মূলদ্বয় কী কী?", options: ["(2, 3)", "(-2, -3)", "(1, 6)", "(-1, -6)"], answer: 0 },
    { question: "২০. দুটি ভেক্টরের লব্ধির মান সর্বোচ্চ হয় যখন তাদের মধ্যবর্তী কোণ—", options: ["0°", "90°", "120°", "180°"], answer: 0 }
  ];

  let currentIndex = 0;
  let userAnswers = Array(questions.length).fill(null);
  let timerInterval;
  let timeLeft = 1200;

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      document.getElementById('timer').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        showResults();
      }
      timeLeft--;
    }, 1000);
  }

  function loadQuestion() {
    const q = questions[currentIndex];
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.question.replace(/^[০-৯]+\.\s*/, '')}`;
    document.getElementById('progress').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = `option-btn ${userAnswers[currentIndex] === idx ? 'selected' : ''}`;
      btn.innerText = opt;
      btn.onclick = () => selectOption(btn, idx);
      container.appendChild(btn);
    });

    document.getElementById('next-btn').innerText = (currentIndex === questions.length - 1) ? "Submit Test" : "Next Question";
  }

  function selectOption(btn, idx) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.remove('selected'));
    
    if (userAnswers[currentIndex] === idx) {
      userAnswers[currentIndex] = null;
    } else {
      userAnswers[currentIndex] = idx;
      btn.classList.add('selected');
    }
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      loadQuestion();
    } else {
      clearInterval(timerInterval);
      showResults();
    }
  }

  function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('result-body').style.display = 'block';

    let correct = 0;
    let wrong = 0;
    let skipped = 0;

    userAnswers.forEach((ans, idx) => {
      if (ans === null) {
        skipped++;
      } else if (ans === questions[idx].answer) {
        correct++;
      } else {
        wrong++;
      }
    });

    let finalScore = (correct * 1.0) - (wrong * 0.25);

    document.getElementById('final-score').innerText = `${finalScore.toFixed(2)} / ${questions.length}`;
    document.getElementById('correct-cnt').innerText = correct;
    document.getElementById('wrong-cnt').innerText = wrong;
    document.getElementById('skip-cnt').innerText = skipped;

    let percentage = (finalScore / questions.length) * 100;
    let msg = percentage >= 70 ? "Excellent Performance! Engineering ready." : "Needs more practice on weak areas.";
    document.getElementById('feedback-text').innerText = msg;
  }

  function restartExam() {
    currentIndex = 0;
    userAnswers = Array(questions.length).fill(null);
    timeLeft = 1200;
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('result-body').style.display = 'none';
    loadQuestion();
    startTimer();
  }

  loadQuestion();
  startTimer();
</script>

</body>
</html>
